name: App Storeに提出

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例: 1.0.0）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  upload:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 秘密情報の確認
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do if [ -z "${!v}" ]; then echo "::error::GitHub Secrets に $v がありません"; exit 1; fi; done

      - name: APIキーを置く
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::GitHub Secrets に ASC_KEY_P8 がありません"; exit 1; fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KP="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KP"
          echo "ASC_KEY_PATH=$KP" >> "$GITHUB_ENV"

      - name: Bundle ID の登録とアプリの確認
        id: asc
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/asc_bundle_id.py

      - name: 依存パッケージを入れる
        run: npm ci

      - name: Web部分をiOSプロジェクトにコピー
        run: npx cap sync ios

      - name: 署名してアーカイブ
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            MARKETING_VERSION="${APP_VERSION#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation -skipMacroValidation \
            archive 2>&1 | tee archive.log | grep -E "error:|BUILD|ARCHIVE" || true
          test -d build/App.xcarchive || { grep -E "error:" archive.log | head -60 > errors.txt; tail -120 archive.log >> errors.txt; cat errors.txt; exit 1; }

      - name: App Store Connect にアップロード
        if: steps.asc.outputs.app_missing != '1'
        run: |
          set -o pipefail
          cd ios/App
          cat > ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log || { grep -iE "error" export.log | head -60 > errors.txt; tail -120 export.log >> errors.txt; cat errors.txt; exit 1; }

      - name: アプリ未作成のお知らせ
        if: steps.asc.outputs.app_missing == '1'
        run: |
          echo "::error::ビルドは成功しましたが、App Store Connect にアプリがまだありません。マイApp → ＋ → 新規App で作成してから、もう一度実行してください。"
          exit 1

      - name: 失敗したらエラー内容を公開（修正用）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=ios/App/errors.txt; [ -f "$f" ] || { echo "ログなし（上の手順のエラーを確認）" > "$f"; }
          sed -i '' -E 's/(AuthKey_)[A-Z0-9]+/\1***/g' "$f" || true
          gh release create "asc-log-${{ github.run_number }}" "$f" --prerelease --title "App Store提出エラー ${{ github.run_number }}" --notes "提出失敗のログ" || true
